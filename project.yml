# Source of truth for Squatter.xcodeproj — regenerate with `xcodegen generate`.
name: Squatter
# Sparkle is the one third-party dependency (owner decision, 2026-08-30 — see
# PROJECT_SPEC.md "Known Tradeoffs"). Pinned exactly: the framework ships inside a
# notarized bundle, so it must not move without a deliberate bump here.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
options:
  bundleIdPrefix: sa.ni
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: M8A3G95883
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Squatter:
    type: application
    platform: macOS
    sources:
      - path: Squatter
        excludes:
          - "Info.plist"
    dependencies:
      - package: Sparkle
    info:
      path: Squatter/Info.plist
      properties:
        CFBundleName: Squatter
        CFBundleDisplayName: Squatter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        # Shown in Finder's Get Info *and* in the app's own About section, which reads this
        # key rather than hardcoding the credit — one place to bump the year. Publication
        # year, not the user's clock: an old build must not claim a year it did not ship in.
        # The MIT licence has its own row in About, so it is not repeated here.
        NSHumanReadableCopyright: "© 2026 National Idea LLC"
        # Sparkle. The feed is a release asset: GitHub redirects releases/latest/download/<name>
        # to the newest release's copy, so publishing a release is the whole deployment.
        SUFeedURL: https://github.com/National-Idea-LLC/squatter/releases/latest/download/appcast.xml
        # Public half of the EdDSA pair generated with Sparkle's generate_keys. The private
        # half lives in the maintainer's login Keychain and nowhere else. If this and the
        # signing key ever disagree, release.sh refuses to build the appcast.
        SUPublicEDKey: "gEWu/GIBD8BWgt86K7EeXG03pwwzqWmbmG+eVyusEnM="
        # Check the signature before touching the archive, not after.
        SUVerifyUpdateBeforeExtraction: true
        # No telemetry: Sparkle's anonymous system profile stays off (this is the default,
        # written down so nobody has to look it up).
        SUEnableSystemProfiling: false
    entitlements:
      path: Squatter/Squatter.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ni.squatter
        PRODUCT_NAME: Squatter
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  SquatterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SquatterTests
    dependencies:
      - target: Squatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ni.squatter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Squatter.app/Contents/MacOS/Squatter
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Squatter:
    build:
      targets:
        Squatter: all
        SquatterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquatterTests
    archive:
      config: Release
